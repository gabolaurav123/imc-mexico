{% if page_obj and page_obj.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Páginas de resultados">{% if page_obj.has_previous %}<a class="button button-outline button-small" href="?page={{ page_obj.previous_page_number }}&q={{ request.GET.q|urlencode }}&status={{ request.GET.status|urlencode }}&maquinaria={{ request.GET.maquinaria|urlencode }}">← Anterior</a>{% endif %}<span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="button button-outline button-small" href="?page={{ page_obj.next_page_number }}&q={{ request.GET.q|urlencode }}&status={{ request.GET.status|urlencode }}&maquinaria={{ request.GET.maquinaria|urlencode }}">Siguiente →</a>{% endif %}</nav>{% endif %}
