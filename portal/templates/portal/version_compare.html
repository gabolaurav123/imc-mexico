{% if versions_json %}<section id="version-compare" class="surface"><h2>Comparar versiones</h2><p class="small muted">Consulta qué cambió entre dos versiones guardadas. La comparación es de información, no certifica el equipo.</p><div class="form-grid"><div class="form-field"><label for="compare-before">Versión de referencia</label><select id="compare-before">{% for item in versions_json %}<option value="{{ item.id }}">Versión {{ item.number }}</option>{% endfor %}</select></div><div class="form-field"><label for="compare-after">Versión a comparar</label><select id="compare-after">{% for item in versions_json %}<option value="{{ item.id }}">Versión {{ item.number }}</option>{% endfor %}</select></div></div><div class="table-wrap"><table><thead><tr><th>Campo modificado</th><th>Referencia</th><th>Comparación</th></tr></thead><tbody id="version-differences"></tbody></table></div><p id="version-compare-status" class="small muted" role="status"></p></section>{{ versions_json|json_script:'versions-data' }}{% endif %}
